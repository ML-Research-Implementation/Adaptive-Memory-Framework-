name: Security Guard Blocker

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  enforce-security:
    # Run only if the action was triggered by his username
    # And if it's a PR event, only run if the PR was actually merged
    if: |
      github.actor == 'kotigaribharath-byte' && 
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest
    steps:
      - name: Revoke Write Permissions and Block User
        run: |
          echo "⚠️ Unauthorized code modification on main branch detected!"
          echo "Triggered by: ${{ github.actor }} via ${{ github.event_name }}"
          
          # Downgrade user to 'read' via GitHub API
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ADMIN_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com{{ github.repository }}/collaborators/kotigaribharath-byte \
            -d '{"permission":"read"}'
            
          echo "❌ kotigaribharath-byte has been downgraded to READ-ONLY."
          echo "🔒 They are now completely blocked from pushing or merging anything else."
          exit 1

name: Security Guard Blocker

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  enforce-security:
    if: |
      github.actor == 'kotigaribharath-byte' && 
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest
    steps:
      - name: Revoke Write Permissions and Block User
        env:
          # Storing the variables cleanly as environment flags to fix curl syntax
          REPO_PATH: ${{ github.repository }}
          ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_PAT }}
        run: |
          echo "⚠️ Unauthorized code modification on main branch detected!"
          echo "Triggered by: ${{ github.actor }} via ${{ github.event_name }}"
          
          # Executing clean API call using env variables
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.com" \
            -d '{"permission":"read"}'
            
          echo "❌ kotigaribharath-byte has been downgraded to READ-ONLY."
          echo "🔒 They are now completely blocked from pushing or merging anything else."
          exit 1

name: Security Guard Blocker

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  enforce-security:
    if: |
      github.actor == 'kotigaribharath-byte' && 
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest
    steps:
      - name: Revoke Write Permissions and Block User
        uses: ssendon/revoke-collaborator-access-action@v1
        with:
          # Automatically uses the built-in system permission token
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: 'kotigaribharath-byte'

      - name: Log Security Event
        run: |
          echo "❌ Security Guard triggered! kotigaribharath-byte has been removed from the repository."
          echo "🔒 They are completely blocked from pushing or merging code until unblocked."
          exit 1
